name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest -q --cov=route_builder --cov-report=term-missing --cov-report=xml
      - name: Build distribution
        run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/route-builder-wheel
          /tmp/route-builder-wheel/bin/pip install dist/*.whl
          /tmp/route-builder-wheel/bin/route-builder --help
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
