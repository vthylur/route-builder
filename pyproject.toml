[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "route-builder"
version = "0.2.0"
description = "Generate routed GPX, KML, KMZ and GeoJSON expedition packages from structured itineraries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[project.scripts]
route-builder = "route_builder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/route_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
