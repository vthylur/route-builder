[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "route-builder"
version = "0.2.0"
description = "Generate routed GPX, KML, KMZ and GeoJSON expedition packages from structured itineraries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
route-builder = "route_builder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/route_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["route_builder"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
